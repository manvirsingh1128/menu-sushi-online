<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jun Restaurant — Ordine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#121212;color:#f0f0f0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;}

/* ── INPUT SECTION ── */
#input-section{
  padding:48px 20px 20px;
  display:flex;flex-direction:column;align-items:center;
}
.brand{
  font-size:.75em;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:#b8860b;margin-bottom:32px;
}
.input-row{
  display:flex;gap:10px;width:100%;max-width:420px;
}
#code-input{
  flex:1;background:#1a1a1a;border:1.5px solid #333;border-radius:12px;
  color:#f0f0f0;font-size:1.4em;font-weight:600;font-family:inherit;
  padding:14px 18px;outline:none;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s;
}
#code-input::placeholder{color:#444;font-weight:400;font-size:.75em;}
#code-input:focus{border-color:#b8860b;}
/* rimuove le frecce su number input */
#code-input::-webkit-outer-spin-button,
#code-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
#btn-add{
  background:#b8860b;color:#121212;border:none;border-radius:12px;
  font-family:inherit;font-size:1em;font-weight:700;
  padding:14px 22px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:background .15s,transform .1s;
}
#btn-add:active{background:#9a6f08;transform:scale(.97);}

#error-msg{
  display:none;color:#ef4444;font-size:.82em;font-weight:500;
  margin-top:10px;width:100%;max-width:420px;
  padding:10px 14px;background:#2a1111;border-radius:8px;border:1px solid #4a1a1a;
}

/* ── CART LIST ── */
#cart-section{width:100%;max-width:560px;margin:0 auto;padding:0 16px 140px;}
#cart-title{
  font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:2px;
  color:#555;padding:24px 0 12px;border-top:1px solid #222;margin-top:24px;
  display:none;
}
#cart-list{display:flex;flex-direction:column;gap:10px;}
.cart-card{
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;
  display:flex;align-items:center;gap:12px;padding:12px;
}
.cart-thumb{
  width:52px;height:52px;border-radius:10px;object-fit:cover;
  background:#252525;flex-shrink:0;
}
.cart-thumb-placeholder{
  width:52px;height:52px;border-radius:10px;background:#252525;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.72em;font-weight:700;color:#444;letter-spacing:.5px;
}
.cart-info{flex:1;min-width:0;}
.cart-name{font-size:.9em;font-weight:600;line-height:1.25;margin-bottom:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cart-price{font-size:.82em;color:#b8860b;font-weight:600;}
.cart-controls{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.qty-btn{
  width:30px;height:30px;border-radius:50%;border:1.5px solid #333;
  background:none;color:#f0f0f0;font-size:1.1em;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .1s,background .1s;
}
.qty-btn:active{background:#2a2a2a;}
.qty-val{font-size:.95em;font-weight:700;min-width:22px;text-align:center;}
.cart-remove{
  width:30px;height:30px;border-radius:50%;border:none;background:none;
  color:#555;font-size:1em;cursor:pointer;margin-left:2px;
  display:flex;align-items:center;justify-content:center;
  transition:color .1s;
}
.cart-remove:active{color:#ef4444;}

/* ── FOOTER STICKY ── */
#footer{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(18,18,18,.97);backdrop-filter:blur(16px);
  border-top:1px solid #222;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  display:none;
}
#footer-inner{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;gap:12px;}
#footer-total{font-size:.88em;color:#888;line-height:1.3;}
#footer-total strong{display:block;font-size:1.2em;color:#f0f0f0;font-weight:700;}
#btn-send{
  background:#b8860b;color:#121212;border:none;border-radius:12px;
  font-family:inherit;font-size:.95em;font-weight:700;
  padding:13px 26px;cursor:pointer;white-space:nowrap;
  transition:background .15s,transform .1s;
}
#btn-send:active{background:#9a6f08;transform:scale(.97);}

/* ── CONFERMA OVERLAY ── */
#confirm-overlay{
  display:none;position:fixed;inset:0;z-index:999;
  background:#121212;
  flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;gap:16px;
  animation:fadeIn .3s ease;
}
#confirm-overlay.open{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.confirm-check{
  width:72px;height:72px;border-radius:50%;
  background:#b8860b;display:flex;align-items:center;justify-content:center;
  font-size:2em;color:#121212;margin-bottom:8px;
}
.confirm-title{font-size:1.5em;font-weight:700;text-align:center;}
.confirm-sub{font-size:.85em;color:#666;text-align:center;margin-top:-8px;}
#confirm-list{
  width:100%;max-width:400px;max-height:45vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;margin-top:8px;
}
.confirm-row{
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;
}
.confirm-row-name{font-size:.88em;font-weight:600;}
.confirm-row-qty{font-size:.82em;color:#b8860b;font-weight:700;}
#confirm-grand{
  font-size:1.1em;font-weight:700;color:#b8860b;
  width:100%;max-width:400px;text-align:right;
  padding:4px 2px;
}
#btn-new{
  margin-top:12px;background:none;border:1.5px solid #333;border-radius:12px;
  color:#f0f0f0;font-family:inherit;font-size:.9em;font-weight:600;
  padding:12px 32px;cursor:pointer;
}
#btn-new:active{background:#1a1a1a;}
</style>
</head>
<body>

<!-- ── INPUT ── -->
<div id="input-section">
  <div class="brand">Jun Restaurant</div>
  <div class="input-row">
    <input id="code-input" type="text" inputmode="numeric" pattern="[0-9]*"
           placeholder="Numero piatto..." autocomplete="off" autocorrect="off">
    <button id="btn-add" onclick="addDish()">Aggiungi</button>
  </div>
  <div id="error-msg"></div>
</div>

<!-- ── CARRELLO ── -->
<div id="cart-section">
  <div id="cart-title">Piatti selezionati</div>
  <div id="cart-list"></div>
</div>

<!-- ── FOOTER ── -->
<div id="footer">
  <div id="footer-inner">
    <div id="footer-total">
      <span id="ft-count"></span>
      <strong id="ft-price"></strong>
    </div>
    <button id="btn-send" onclick="sendOrder()">Invia ordine</button>
  </div>
</div>

<!-- ── CONFERMA ── -->
<div id="confirm-overlay">
  <div class="confirm-check">✓</div>
  <div class="confirm-title">Ordine inviato!</div>
  <div class="confirm-sub">Il tuo ordine è stato registrato.</div>
  <div id="confirm-list"></div>
  <div id="confirm-grand"></div>
  <button id="btn-new" onclick="resetOrder()">Nuovo ordine</button>
</div>

// ── LOOKUP MAP ────────────────────────────────────────────────────────────────
const dishMap = new Map();
menuData.forEach(cat => cat.items.forEach(item => dishMap.set(item.id, item)));

// ── CART ──────────────────────────────────────────────────────────────────────
const cart = new Map(); // id → { dish, qty }

function priceNum(dish){
  return parseFloat(dish.price.replace('€','').replace(',','.')) || 0;
}

function cartTotal(){
  let n=0, sum=0;
  cart.forEach(({dish,qty})=>{ n+=qty; sum+=priceNum(dish)*qty; });
  return { n, sum };
}

// ── ADD ───────────────────────────────────────────────────────────────────────
function addDish(){
  const inp = document.getElementById('code-input');
  const raw = inp.value.trim();
  const err = document.getElementById('error-msg');

  if(!raw){ showError('Scrivi il numero del piatto.'); return; }

  const id = parseInt(raw, 10);
  const dish = dishMap.get(id);

  if(!dish){
    showError(`Numero ${raw} non trovato — controlla sul menu.`);
    inp.select();
    return;
  }

  err.style.display = 'none';

  if(cart.has(id)){
    cart.get(id).qty++;
  } else {
    cart.set(id, { dish, qty:1 });
  }

  inp.value = '';
  inp.focus();
  renderCart();
}

function showError(msg){
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// ── RENDER CART ───────────────────────────────────────────────────────────────
function renderCart(){
  const list  = document.getElementById('cart-list');
  const title = document.getElementById('cart-title');
  const footer= document.getElementById('footer');

  list.innerHTML = '';

  if(cart.size === 0){
    title.style.display = 'none';
    footer.style.display = 'none';
    return;
  }

  title.style.display = 'block';
  footer.style.display = 'block';

  cart.forEach(({dish, qty}, id) => {
    const imgSrc = dishImgs[id];
    const thumbHtml = imgSrc
      ? `<img class="cart-thumb" src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
         <div class="cart-thumb-placeholder" style="display:none;">${id}</div>`
      : `<div class="cart-thumb-placeholder">${id}</div>`;

    const div = document.createElement('div');
    div.className = 'cart-card';
    div.dataset.id = id;
    div.innerHTML = `
      ${thumbHtml}
      <div class="cart-info">
        <div class="cart-name">${dish.name}</div>
        <div class="cart-price">${dish.price}</div>
      </div>
      <div class="cart-controls">
        <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
        <span class="qty-val">${qty}</span>
        <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
        <button class="cart-remove" onclick="removeDish(${id})" title="Rimuovi">✕</button>
      </div>
    `;
    list.appendChild(div);
  });

  updateFooter();
}

function changeQty(id, delta){
  if(!cart.has(id)) return;
  const entry = cart.get(id);
  entry.qty += delta;
  if(entry.qty <= 0){ cart.delete(id); }
  renderCart();
}

function removeDish(id){
  cart.delete(id);
  renderCart();
}

function updateFooter(){
  const { n, sum } = cartTotal();
  document.getElementById('ft-count').textContent = n === 1 ? '1 piatto' : `${n} piatti`;
  document.getElementById('ft-price').textContent = `€${sum.toFixed(2).replace('.',',')}`;
}

// ── SEND ─────────────────────────────────────────────────────────────────────
function sendOrder(){
  if(cart.size === 0) return;

  const { n, sum } = cartTotal();
  const items = [];
  cart.forEach(({dish,qty}) => items.push({ id:dish.id, name:dish.name, qty, prezzo:dish.price }));

  console.log('─── ORDINE JUN ────────────────────');
  console.log('Piatti:', items);
  console.log('Totale piatti:', n);
  console.log('Totale:', `€${sum.toFixed(2)}`);
  console.log('───────────────────────────────────');

  // Conferma UI
  const cl = document.getElementById('confirm-list');
  cl.innerHTML = '';
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'confirm-row';
    row.innerHTML = `<span class="confirm-row-name">${it.name}</span><span class="confirm-row-qty">${it.qty}×</span>`;
    cl.appendChild(row);
  });
  document.getElementById('confirm-grand').textContent = `Totale: €${sum.toFixed(2).replace('.',',')}`;
  document.getElementById('confirm-overlay').classList.add('open');
}

function resetOrder(){
  cart.clear();
  document.getElementById('confirm-overlay').classList.remove('open');
  document.getElementById('error-msg').style.display = 'none';
  renderCart();
  document.getElementById('code-input').focus();
}

// ── ENTER KEY ────────────────────────────────────────────────────────────────
document.getElementById('code-input').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); addDish(); }
});

// ── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('code-input').focus();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jun — Staff</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',-apple-system,sans-serif;}
body{background:#f2f2f2;color:#1a1a1a;overflow-x:hidden;}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:#000;height:52px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.h-logo{height:22px;filter:brightness(0) invert(1);}
.h-mid{display:flex;align-items:center;gap:10px;}
.h-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.h-cnt{
  display:flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;
  font-size:0.74em;font-weight:700;
}
.h-cnt-o{background:rgba(217,119,6,.2);color:#fbbf24;}
.h-cnt-r{background:rgba(234,88,12,.2);color:#fb923c;}
#clock{font-size:0.95em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}

/* ── TOOLBAR ── */
#toolbar{
  background:#fff;border-bottom:1px solid #e5e5e5;
  padding:6px 16px;display:flex;align-items:center;gap:14px;
}
.tb{font-size:0.76em;color:#888;}
.tb strong{color:#1a1a1a;font-weight:700;}
#tb-time{font-size:0.72em;color:#bbb;}
#demo-btn{
  margin-left:auto;padding:5px 13px;
  background:#f0f0f0;border:1px solid #ddd;color:#555;
  border-radius:20px;font-size:0.74em;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .15s;
}
#demo-btn:hover{background:#e5e5e5;}
#demo-btn:disabled{opacity:.5;cursor:default;}

/* ── MOBILE TABS ── */
#mob-tabs{
  display:none;background:#fff;border-bottom:1px solid #e5e5e5;
  padding:0 16px;gap:0;
}
@media(max-width:640px){
  #mob-tabs{display:flex;}
  .split{flex-direction:column!important;}
  .col-req,.col-ord{width:100%!important;border:none!important;border-radius:0!important;}
  .col-req,.col-ord{display:none;}
  .col-req.active,.col-ord.active{display:flex;}
}
.mt-btn{
  flex:1;padding:10px;border:none;background:none;
  font-family:inherit;font-size:0.82em;font-weight:600;
  color:#888;cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;
}
.mt-btn.on{color:#1a1a1a;border-bottom-color:#1a1a1a;}

/* ── SPLIT LAYOUT ── */
.split{
  display:flex;min-height:calc(100vh - 96px);
  align-items:stretch;
}
.col-req{
  width:38%;flex-shrink:0;
  display:flex;flex-direction:column;
  background:#fff;border-right:1px solid #e5e5e5;
}
.col-ord{
  flex:1;display:flex;flex-direction:column;
  background:#f2f2f2;
}
.col-hd{
  padding:10px 14px;border-bottom:1px solid #ebebeb;
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;position:sticky;top:52px;z-index:10;
}
.col-hd-l{display:flex;align-items:center;gap:7px;}
.col-hd-l h2{font-size:0.76em;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#555;}
.col-badge{
  padding:2px 8px;border-radius:20px;
  font-size:0.72em;font-weight:700;
}
.badge-req{background:#fff3eb;color:#ea580c;}
.badge-ord{background:#fffbeb;color:#d97706;}
.col-cards{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;}

/* ── ORD GRID ── */
.ord-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:8px;padding:10px;align-items:start;
}

/* ── EMPTY ── */
.empty-state{
  padding:40px 16px;text-align:center;color:#ccc;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty-state i{font-size:2em;opacity:.4;}
.empty-state p{font-size:0.85em;}

/* ── CARD BASE ── */
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:scale(.96)}}

.kds-card{
  background:#fff;border-radius:12px;
  border:1px solid #e5e5e5;
  border-left:3px solid #ddd;
  display:flex;flex-direction:column;
  animation:slideIn .2s ease-out;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.kds-card.card-out{animation:cardOut .25s ease-out forwards;}

/* Status left-border colors */
.s-new  {border-left-color:#d97706;}
.s-prep {border-left-color:#2563eb;}
.s-ready{border-left-color:#16a34a;}
.s-req  {border-left-color:#ea580c;}
.s-urg  {border-left-color:#dc2626;}

/* ── CARD TOP ── */
.card-top{
  padding:10px 12px 8px;
  display:flex;align-items:flex-start;justify-content:space-between;
}
.card-top-l{display:flex;flex-direction:column;gap:2px;}
.card-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:0.64em;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;
  width:fit-content;
}
.cb-new  {background:#fef3c7;color:#d97706;}
.cb-prep {background:#dbeafe;color:#2563eb;}
.cb-ready{background:#dcfce7;color:#16a34a;}
.cb-req  {background:#ffedd5;color:#ea580c;}
.cb-urg  {background:#fee2e2;color:#dc2626;}
.card-tnum{
  font-size:2.6em;font-weight:800;line-height:1;
  letter-spacing:-0.04em;color:#1a1a1a;
}
.card-tlbl{font-size:0.62em;font-weight:600;color:#999;letter-spacing:.5px;text-transform:uppercase;}
.card-top-r{text-align:right;}
.card-timer{font-size:0.75em;font-weight:600;color:#aaa;font-variant-numeric:tabular-nums;}
.card-timer.t-warn{color:#d97706;}
.card-timer.t-urg{color:#dc2626;font-weight:700;}

/* ── CARD BODY ── */
.card-body{padding:0 12px 10px;display:flex;flex-direction:column;gap:7px;}
.card-div{border:none;border-top:1px solid #f0f0f0;margin:0;}
.card-items{list-style:none;display:flex;flex-direction:column;gap:4px;}
.card-items li{display:flex;align-items:baseline;gap:6px;font-size:0.85em;}
.i-qty{font-weight:700;min-width:24px;color:#888;}
.i-name{color:#1a1a1a;flex:1;line-height:1.3;}
.i-code{color:#ccc;font-size:0.78em;}
.card-note{
  display:flex;align-items:flex-start;gap:6px;
  padding:6px 9px;background:#f9fafb;border-radius:8px;
  font-size:0.8em;color:#888;line-height:1.4;border-left:2px solid #e5e5e5;
}
.card-note i{color:#ccc;font-size:.85em;margin-top:1px;flex-shrink:0;}

/* ── STAFF REQUEST ── */
.req-row{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;background:#fff7f0;border-radius:9px;
  font-size:0.9em;font-weight:600;color:#ea580c;
}
.req-row i{font-size:1em;width:18px;text-align:center;color:#fb923c;}

/* ── CARD ACTION ── */
.card-btn{
  width:100%;padding:11px;border:none;
  border-top:1px solid #f0f0f0;
  border-radius:0 0 11px 11px;
  font-family:inherit;font-size:0.82em;font-weight:700;
  text-transform:uppercase;letter-spacing:.3px;
  cursor:pointer;background:#fafafa;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .12s;color:#555;
}
.card-btn:hover{background:#f0f0f0;}
.card-btn:active{background:#e8e8e8;}
.btn-new  {color:#d97706;}
.btn-new:hover{background:#fffbeb;}
.btn-prep {color:#2563eb;}
.btn-prep:hover{background:#eff6ff;}
.btn-ready{background:#16a34a;color:#fff;border-top-color:transparent;}
.btn-ready:hover{background:#15803d;}
.btn-req  {color:#ea580c;}
.btn-req:hover{background:#fff7f0;}

/* ── DONE OVERLAY ── */
.done-wrap{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:18px;gap:6px;text-align:center;
}
.done-wrap i{font-size:2.2em;color:#16a34a;}
.done-wrap strong{color:#16a34a;font-size:0.95em;}
.done-wrap small{color:#bbb;font-size:0.78em;}
</style>
</head>
<body>

<header>
  <img class="h-logo" src="https://www.junrestaurantbolgare.com/wp-content/uploads/2024/12/jun-logo-white.svg" alt="Jun">
  <div class="h-mid">
    <div class="h-cnt h-cnt-o"><i class="fas fa-utensils"></i> <span id="hb-ord">0</span></div>
    <div class="h-cnt h-cnt-r"><i class="fas fa-bell"></i> <span id="hb-req">0</span></div>
    <div class="h-dot"></div>
  </div>
  <span id="clock">--:--</span>
</header>

<div id="toolbar">
  <span class="tb">Ordini: <strong id="tb-o">0</strong></span>
  <span class="tb">Pronti: <strong id="tb-r">0</strong></span>
  <span class="tb">Richieste: <strong id="tb-s">0</strong></span>
  <span id="tb-time"></span>
  <button id="demo-btn" onclick="loadDemo()"><i class="fas fa-flask"></i> Demo</button>
</div>

<div id="mob-tabs">
  <button class="mt-btn on" onclick="mobTab('ord',this)"><i class="fas fa-utensils"></i> Ordini</button>
  <button class="mt-btn" onclick="mobTab('req',this)"><i class="fas fa-bell"></i> Richieste</button>
</div>

<div class="split">

  <!-- COL RICHIESTE CAMERIERE -->
  <div class="col-req active" id="col-req">
    <div class="col-hd">
      <div class="col-hd-l">
        <i class="fas fa-bell" style="color:#ea580c;font-size:.85em;"></i>
        <h2>Richieste</h2>
      </div>
      <span class="col-badge badge-req" id="badge-req">0</span>
    </div>
    <div class="col-cards" id="req-container">
      <div class="empty-state" id="empty-req">
        <i class="fas fa-bell-slash"></i>
        <p>Nessuna richiesta</p>
      </div>
    </div>
  </div>

  <!-- COL ORDINI CUCINA -->
  <div class="col-ord active" id="col-ord">
    <div class="col-hd" style="background:#f2f2f2;border-bottom-color:#e0e0e0;">
      <div class="col-hd-l">
        <i class="fas fa-utensils" style="color:#d97706;font-size:.85em;"></i>
        <h2>Ordini cucina</h2>
      </div>
      <span class="col-badge badge-ord" id="badge-ord">0</span>
    </div>
    <div class="ord-grid" id="ord-container">
      <div class="empty-state" id="empty-ord" style="grid-column:1/-1">
        <i class="fas fa-check-circle"></i>
        <p>Nessun ordine in attesa</p>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL  = "https://jnzxhokxldzymnapcchd.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impuenhob2t4bGR6eW1uYXBjY2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MDkyODIsImV4cCI6MjA4MTI4NTI4Mn0.EaPqeczsuYGwMky9t5ove_uk17dNWcYFaWXb2CfiFgo";
const client  = supabase.createClient(SB_URL, SB_ANON);

// ── State ──────────────────────────────────────────────────────────────────
const reqData = new Map();  // waiter requests
const ordData = new Map();  // food orders
const animating = new Set();

// ── Mobile tabs ────────────────────────────────────────────────────────────
function mobTab(which, btn) {
  document.querySelectorAll('.mt-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('col-req').classList.toggle('active', which==='req');
  document.getElementById('col-ord').classList.toggle('active', which==='ord');
}

// ── Clock ──────────────────────────────────────────────────────────────────
function tick(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick,10000);

// ── Audio ──────────────────────────────────────────────────────────────────
function beep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [880,1100].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(.28,ctx.currentTime+i*.15);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.15+.28);
      o.start(ctx.currentTime+i*.15);o.stop(ctx.currentTime+i*.15+.28);
    });
  }catch(_){}
}

// ── Timer ──────────────────────────────────────────────────────────────────
function elMin(ts){ return Math.floor((Date.now()-new Date(ts))/60000); }
function fmtMin(m){ return m<1?'<1 min':`${m} min`; }
function timerCls(m,st){
  if(st==='ready') return m>=5?'t-urg':'t-warn';
  if(m>=10) return 't-urg';
  if(m>=5) return 't-warn';
  return '';
}

setInterval(()=>{
  document.querySelectorAll('[data-ts]').forEach(el=>{
    const m=elMin(el.dataset.ts);
    const st=el.dataset.st||'';
    el.textContent=fmtMin(m);
    el.className='card-timer '+timerCls(m,st);
  });
  ordData.forEach((o,id)=>{
    if(o.status==='pending'&&elMin(o.created_at)>=10){
      const card=document.querySelector(`.kds-card[data-id="${id}"]`);
      if(card&&!card.classList.contains('s-urg')){
        card.classList.remove('s-new');card.classList.add('s-urg');
        const b=card.querySelector('.card-badge');
        if(b){b.className='card-badge cb-urg';b.textContent='ATTESA';}
      }
    }
  });
},60000);

// ── Parse items ────────────────────────────────────────────────────────────
function parseItems(raw){
  try{return JSON.parse(raw);}catch{
    return String(raw||'').split(',').filter(Boolean).map(s=>{
      const e=s.indexOf('=');
      return e<0?{qty:1,name:s.trim(),code:''}:{qty:parseInt(s.slice(1,e))||1,name:s.slice(e+1).trim(),code:''};
    });
  }
}

// ── Staff types ────────────────────────────────────────────────────────────
const STAFF={
  explanation:{icon:'fa-circle-info', label:'Spiegazione piatti'},
  drinks:     {icon:'fa-mug-saucer',  label:'Ordine bevande'},
  bill:       {icon:'fa-receipt',     label:'Richiesta conto'},
  call:       {icon:'fa-bell',        label:'Chiamata cameriere'},
  other:      {icon:'fa-comment-dots',label:'Altra richiesta'},
};

// ── Sort orders ────────────────────────────────────────────────────────────
function ordSortKey(o){
  const w=o.status==='ready'?0:o.status==='preparing'?1:2;
  return w*1e13+new Date(o.created_at).getTime();
}

// ── Build order card ───────────────────────────────────────────────────────
function buildOrderCard(o){
  const items=parseItems(o.order_details);
  const st=o.status;
  const min=elMin(o.created_at);
  const isUrg=st==='pending'&&min>=10;

  const sClass=isUrg?'s-urg':st==='pending'?'s-new':st==='preparing'?'s-prep':'s-ready';
  const bCls  =isUrg?'cb-urg':st==='pending'?'cb-new':st==='preparing'?'cb-prep':'cb-ready';
  const bTxt  =isUrg?'ATTESA':st==='pending'?'NUOVO':st==='preparing'?'IN PREP':'PRONTO';
  const btnCls=st==='pending'?'btn-new':st==='preparing'?'btn-prep':'btn-ready';
  const btnTxt=st==='pending'
    ?'<i class="fas fa-fire-burner"></i> In preparazione'
    :st==='preparing'
    ?'<i class="fas fa-bell-concierge"></i> Pronto'
    :'<i class="fas fa-check"></i> Servito';

  const itemsHtml=items.map(i=>
    `<li><span class="i-qty">×${i.qty}</span><span class="i-name">${i.name}</span>${i.code?`<span class="i-code">#${i.code}</span>`:''}</li>`
  ).join('');
  const noteHtml=o.customer_notes
    ?`<div class="card-note"><i class="fas fa-pen-line"></i>${o.customer_notes}</div>`:'';

  const card=document.createElement('div');
  card.className=`kds-card ${sClass}`;
  card.dataset.id=String(o.order_id);
  card.innerHTML=`
    <div class="card-top">
      <div class="card-top-l">
        <span class="card-badge ${bCls}">${bTxt}</span>
        <span class="card-tlbl">Tavolo</span>
        <span class="card-tnum">${o.table_number}</span>
      </div>
      <div class="card-top-r">
        <div class="card-timer ${timerCls(min,st)}" data-ts="${o.created_at}" data-st="${st}">${fmtMin(min)}</div>
      </div>
    </div>
    <div class="card-body">
      <hr class="card-div">
      <ul class="card-items">${itemsHtml}</ul>
      ${noteHtml}
    </div>
    <button class="card-btn ${btnCls}">${btnTxt}</button>`;

  card.querySelector('.card-btn').addEventListener('click',async()=>{
    const id=String(o.order_id);
    if(st==='ready'){
      animating.add(id);ordData.delete(id);
      card.querySelector('.card-body').innerHTML=`<div class="done-wrap">
        <i class="fas fa-circle-check"></i>
        <strong>Consegnato!</strong>
        <small>Tavolo ${o.table_number}</small></div>`;
      card.querySelector('.card-btn').remove();
      updateStats();
      setTimeout(()=>{
        card.classList.add('card-out');
        setTimeout(()=>{card.remove();animating.delete(id);updateEmpty();updateStats();},250);
      },1300);
      await advance(id,st);
    } else {
      const nst=st==='pending'?'preparing':'ready';
      ordData.set(id,{...o,status:nst});
      renderOrders();
      await advance(id,st);
    }
  });
  return card;
}

// ── Build staff card ───────────────────────────────────────────────────────
function buildStaffCard(o){
  const type=o.waiter_request||'call';
  const info=STAFF[type]||STAFF.other;
  const min=elMin(o.created_at);

  const card=document.createElement('div');
  card.className='kds-card s-req';
  card.dataset.id=String(o.order_id);
  card.innerHTML=`
    <div class="card-top">
      <div class="card-top-l">
        <span class="card-badge cb-req">RICHIESTA</span>
        <span class="card-tlbl">Tavolo</span>
        <span class="card-tnum">${o.table_number}</span>
      </div>
      <div class="card-top-r">
        <div class="card-timer" data-ts="${o.created_at}">${fmtMin(min)}</div>
      </div>
    </div>
    <div class="card-body">
      <hr class="card-div">
      <div class="req-row"><i class="fas ${info.icon}"></i>${info.label}</div>
    </div>
    <button class="card-btn btn-req"><i class="fas fa-check"></i> Gestita</button>`;

  card.querySelector('.card-btn').addEventListener('click',async()=>{
    const id=String(o.order_id);
    animating.add(id);reqData.delete(id);
    card.classList.add('card-out');
    updateStats();
    setTimeout(()=>{card.remove();animating.delete(id);updateEmpty();updateStats();},250);
    await client.from('orders').update({status:'handled'}).eq('order_id',id);
  });
  return card;
}

// ── Render orders ──────────────────────────────────────────────────────────
function renderOrders(){
  const cont=document.getElementById('ord-container');
  const empty=document.getElementById('empty-ord');

  cont.querySelectorAll('.kds-card').forEach(el=>{
    if(!animating.has(el.dataset.id)) el.remove();
  });

  const sorted=[...ordData.values()].sort((a,b)=>ordSortKey(a)-ordSortKey(b));
  sorted.forEach(o=>{
    if(!animating.has(String(o.order_id)))
      cont.appendChild(buildOrderCard(o));
  });

  empty.style.display=ordData.size===0&&!cont.querySelector('.kds-card')?'':'none';
  updateStats();
}

// ── Render requests ────────────────────────────────────────────────────────
function renderRequests(){
  const cont=document.getElementById('req-container');
  const empty=document.getElementById('empty-req');

  cont.querySelectorAll('.kds-card').forEach(el=>{
    if(!animating.has(el.dataset.id)) el.remove();
  });
  [...reqData.values()]
    .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
    .forEach(o=>{ if(!animating.has(String(o.order_id))) cont.appendChild(buildStaffCard(o)); });

  empty.style.display=reqData.size===0&&!cont.querySelector('.kds-card')?'':'none';
  updateStats();
}

function updateEmpty(){
  const oc=document.getElementById('ord-container');
  const rc=document.getElementById('req-container');
  document.getElementById('empty-ord').style.display=
    ordData.size===0&&!oc.querySelector('.kds-card')?'':'none';
  document.getElementById('empty-req').style.display=
    reqData.size===0&&!rc.querySelector('.kds-card')?'':'none';
}

function updateStats(){
  const nO=ordData.size,nR=ordData.size&&[...ordData.values()].filter(o=>o.status==='ready').length,nS=reqData.size;
  document.getElementById('hb-ord').textContent=nO;
  document.getElementById('hb-req').textContent=nS;
  document.getElementById('tb-o').textContent=nO;
  document.getElementById('tb-r').textContent=nR;
  document.getElementById('tb-s').textContent=nS;
  document.getElementById('badge-ord').textContent=nO;
  document.getElementById('badge-req').textContent=nS;
  document.getElementById('tb-time').textContent=
    'Aggiornato '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

// ── Supabase ops ───────────────────────────────────────────────────────────
const CYCLE=['pending','preparing','ready'];
async function advance(id,cur){
  const idx=CYCLE.indexOf(cur);
  const next=idx>=CYCLE.length-1?'served':CYCLE[idx+1];
  const{error}=await client.from('orders').update({status:next}).eq('order_id',id);
  if(error) console.warn('advance:',error.message);
}

// ── Load ───────────────────────────────────────────────────────────────────
async function loadInitialOrders(){
  const{data,error}=await client.from('orders').select('*')
    .not('status','in','("served","handled")')
    .order('created_at',{ascending:true});
  if(error){console.error(error);return;}
  (data||[]).forEach(o=>{
    const id=String(o.order_id);
    if(o.waiter_request) reqData.set(id,o);
    else ordData.set(id,o);
  });
  renderOrders();renderRequests();
}

// ── Realtime ───────────────────────────────────────────────────────────────
client.channel('kds-rt')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},({new:o})=>{
    beep();
    const id=String(o.order_id);
    if(o.waiter_request){reqData.set(id,o);renderRequests();}
    else{ordData.set(id,o);renderOrders();}
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},({new:o})=>{
    const id=String(o.order_id);
    if(o.status==='served'||o.status==='handled'){
      ordData.delete(id);reqData.delete(id);
      if(!animating.has(id)){
        const el=document.querySelector(`.kds-card[data-id="${id}"]`);
        if(el){el.classList.add('card-out');setTimeout(()=>{el.remove();updateEmpty();updateStats();},250);}
      }
    } else if(o.waiter_request){
      reqData.set(id,o);renderRequests();
    } else {
      ordData.set(id,o);renderOrders();
    }
  })
  .subscribe();

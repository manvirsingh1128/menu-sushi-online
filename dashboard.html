<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jun Restaurant — Staff</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',-apple-system,sans-serif;}
:root{
  --bg:#0d0d0d;--surface:#161616;--border:#242424;
  --gold:#c9a84c;--green:#27ae60;--blue:#2563eb;--red:#e74c3c;--orange:#e67e22;
  --text:#e8e8e8;--text2:#888;--text3:#444;
}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── HEADER ── */
header{
  background:#000;border-bottom:1px solid #1a1a1a;
  padding:0 20px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
}
.h-logo{height:28px;object-fit:contain;filter:brightness(0) invert(1);}
.h-center{display:flex;align-items:center;gap:8px;}
.h-live{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.h-label{font-size:0.78em;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
#clock{font-size:1em;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}

/* ── STATS BAR ── */
#stats-bar{
  background:#111;border-bottom:1px solid #1d1d1d;
  padding:8px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.stat{display:flex;align-items:center;gap:6px;font-size:0.82em;color:var(--text2);}
.stat-val{font-size:1em;font-weight:700;color:#fff;}
.stat-sep{width:1px;height:16px;background:var(--border);}
#demo-btn{
  margin-left:auto;padding:5px 14px;background:rgba(201,168,76,.12);
  border:1px solid rgba(201,168,76,.3);color:var(--gold);
  border-radius:20px;font-size:0.78em;font-weight:600;cursor:pointer;font-family:inherit;
}
#demo-btn:hover{background:rgba(201,168,76,.2);}

/* ── MAIN GRID ── */
.dashboard{
  display:grid;grid-template-columns:1fr 1fr;
  min-height:calc(100vh - 96px);
}
@media(max-width:640px){.dashboard{grid-template-columns:1fr;}}
.col{padding:16px;border-right:1px solid var(--border);}
.col:last-child{border-right:none;}
.col-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.col-header h2{font-size:0.78em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);}
.col-badge{
  background:#222;color:var(--gold);
  font-size:0.75em;font-weight:700;
  padding:2px 9px;border-radius:20px;
  min-width:24px;text-align:center;
}
.cards{display:flex;flex-direction:column;gap:12px;}

/* ── ORDER CARD ── */
@keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardOut{to{opacity:0;transform:scale(0.96);max-height:0;overflow:hidden;padding:0;margin:0;border:0;}}
@keyframes readyPulse{0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,0)}50%{box-shadow:0 0 0 8px rgba(39,174,96,.18)}}
@keyframes deliveredFlash{0%{background:#0d2b1a}100%{background:#0f1f12}}

.order-card{
  background:var(--surface);border-radius:14px;
  overflow:hidden;animation:slideIn .3s ease-out;
  border:1px solid var(--border);
  transition:box-shadow .3s;
}
.order-card.s-new   {border-top:4px solid var(--gold);}
.order-card.s-prep  {border-top:4px solid var(--blue);}
.order-card.s-ready {border-top:4px solid var(--green);animation:readyPulse 2.5s ease-in-out infinite;}
.order-card.s-urgent{border-top:4px solid var(--red);border-color:var(--red);}
.order-card.s-delivered{border-top:4px solid var(--green);background:#0d2b1a;}
.order-card.card-out{animation:cardOut .35s ease-out forwards;}

.card-inner{padding:16px;}

/* Card top row */
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.card-table-num{font-size:3.2em;font-weight:800;color:#fff;line-height:1;letter-spacing:-0.04em;}
.card-table-label{font-size:0.65em;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.card-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.card-status-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:0.72em;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;
}
.badge-new    {background:rgba(201,168,76,.15);color:var(--gold);}
.badge-prep   {background:rgba(37,99,235,.15);color:#60a5fa;}
.badge-ready  {background:rgba(39,174,96,.15);color:#4ade80;}
.badge-urgent {background:rgba(231,76,60,.15);color:var(--red);}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1s ease-in-out infinite;}
.card-timer{font-size:0.78em;font-weight:600;color:var(--text3);font-variant-numeric:tabular-nums;}
.card-timer.t-warn{color:var(--orange);}
.card-timer.t-urgent{color:var(--red);font-weight:700;}

/* Items */
.card-divider{border:none;border-top:1px solid #202020;margin:10px 0;}
.card-items{list-style:none;margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
.card-items li{display:flex;align-items:baseline;gap:8px;font-size:0.9em;}
.item-qty{color:var(--gold);font-weight:700;min-width:26px;}
.item-name{color:var(--text);flex:1;}
.item-code{color:var(--text3);font-size:0.78em;}

/* Note */
.card-note{
  display:flex;align-items:flex-start;gap:8px;
  background:rgba(39,174,96,.07);border-left:3px solid var(--green);
  padding:8px 10px;border-radius:0 8px 8px 0;
  font-size:0.82em;color:#aaa;line-height:1.4;margin-bottom:10px;
}
.card-note i{color:var(--green);margin-top:1px;flex-shrink:0;}

/* Action buttons */
.card-action{
  width:100%;padding:12px;border:none;border-radius:10px;
  font-family:inherit;font-size:0.9em;font-weight:700;
  cursor:pointer;transition:filter .15s, transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.card-action:active{transform:scale(0.97);}
.card-action:hover{filter:brightness(1.12);}
.btn-new    {background:var(--gold);color:#000;}
.btn-prep   {background:var(--green);color:#fff;}
.btn-ready  {background:var(--green);color:#fff;font-size:1em;}
.btn-delivered{background:#1a3a2a;color:#4ade80;cursor:default;}

/* Delivered state */
.delivered-msg{
  text-align:center;padding:20px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.delivered-msg i{font-size:2.2em;color:var(--green);}
.delivered-msg p{font-weight:700;color:var(--green);font-size:1em;}
.delivered-msg small{color:var(--text3);font-size:0.8em;}

/* ── STAFF CARD ── */
.staff-card{
  background:#150e00;border:1px solid rgba(230,115,0,.35);
  border-top:4px solid var(--orange);border-radius:14px;
  overflow:hidden;animation:slideIn .3s ease-out;
}
.staff-inner{padding:16px;}
.staff-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.staff-table{font-size:3.2em;font-weight:800;color:#fff;line-height:1;letter-spacing:-0.04em;}
.staff-table-label{font-size:0.65em;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.staff-type{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 12px;background:rgba(230,115,0,.08);border-radius:10px;}
.staff-type i{color:var(--orange);font-size:1.3em;width:24px;text-align:center;}
.staff-type-label{font-size:0.95em;font-weight:600;color:#ff9f43;}
.staff-dismiss{
  width:100%;padding:11px;background:#e67e22;color:#000;
  border:none;border-radius:10px;font-family:inherit;font-size:0.9em;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.staff-dismiss:hover{filter:brightness(1.1);}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 16px;color:var(--text3);}
.empty i{font-size:2.2em;margin-bottom:12px;display:block;opacity:.4;}
.empty p{font-size:0.9em;}
</style>
</head>
<body>

<header>
  <img class="h-logo" src="https://www.junrestaurantbolgare.com/wp-content/uploads/2024/12/jun-logo-white.svg" alt="Jun Restaurant">
  <div class="h-center">
    <div class="h-live"></div>
    <span class="h-label">Staff Dashboard</span>
  </div>
  <span id="clock">—</span>
</header>

<div id="stats-bar">
  <div class="stat"><i class="fas fa-concierge-bell" style="color:var(--gold);"></i> Ordini attivi: <span class="stat-val" id="stat-orders">0</span></div>
  <div class="stat-sep"></div>
  <div class="stat"><i class="fas fa-bell" style="color:var(--orange);"></i> Richieste: <span class="stat-val" id="stat-staff">0</span></div>
  <div class="stat-sep"></div>
  <div class="stat" id="stat-update" style="color:var(--text3);font-size:0.78em;">—</div>
  <button id="demo-btn" onclick="loadDemo()"><i class="fas fa-flask"></i> Carica demo</button>
</div>

<div class="dashboard">
  <div class="col">
    <div class="col-header">
      <h2><i class="fas fa-utensils" style="margin-right:6px;color:var(--gold);"></i>Ordini</h2>
      <span class="col-badge" id="badge-orders">0</span>
    </div>
    <div class="cards" id="orders-container">
      <div class="empty" id="empty-orders"><i class="fas fa-check-circle"></i><p>Nessun ordine in attesa</p></div>
    </div>
  </div>

  <div class="col">
    <div class="col-header">
      <h2><i class="fas fa-bell" style="margin-right:6px;color:var(--orange);"></i>Richieste Staff</h2>
      <span class="col-badge" id="badge-staff">0</span>
    </div>
    <div class="cards" id="staff-container">
      <div class="empty" id="empty-staff"><i class="fas fa-bell"></i><p>Nessuna richiesta</p></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = "https://jnzxhokxldzymnapcchd.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impuenhob2t4bGR6eW1uYXBjY2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MDkyODIsImV4cCI6MjA4MTI4NTI4Mn0.EaPqeczsuYGwMky9t5ove_uk17dNWcYFaWXb2CfiFgo";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── CLOCK ─────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 10000);

// ── AUDIO ─────────────────────────────────────────────────────────────────
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch(_) {}
}

// ── TIMER UTILS ───────────────────────────────────────────────────────────
function elapsedMin(createdAt) {
  return Math.floor((Date.now() - new Date(createdAt)) / 60000);
}
function timerText(min) {
  return min < 1 ? 'adesso' : `${min} min${min >= 10 ? ' ⚠' : ''}`;
}
function timerClass(min, status) {
  if (status === 'ready') return min >= 5 ? 't-urgent' : 't-warn';
  if (min >= 10) return 't-urgent';
  if (min >= 5) return 't-warn';
  return '';
}

// Aggiorna tutti i timer ogni minuto
setInterval(() => {
  document.querySelectorAll('.card-timer[data-created]').forEach(el => {
    const min = elapsedMin(el.dataset.created);
    const status = el.dataset.status;
    el.textContent = '⏱ ' + timerText(min);
    el.className = 'card-timer ' + timerClass(min, status);
    // urgency border
    const card = el.closest('.order-card');
    if (card && status === 'pending' && min >= 10) {
      card.classList.remove('s-new');
      card.classList.add('s-urgent');
      card.querySelector('.card-status-badge').className = 'card-status-badge badge-urgent';
      card.querySelector('.badge-dot') && (card.querySelector('.card-status-badge').innerHTML =
        '<span class="badge-dot"></span>ATTESA');
    }
  });
}, 60000);

// ── PARSE ITEMS ───────────────────────────────────────────────────────────
function parseItems(raw) {
  try { return JSON.parse(raw); } catch {
    return String(raw || '').split(',').filter(Boolean).map(s => {
      const eq = s.indexOf('=');
      return eq === -1 ? { qty: 1, name: s.trim(), code: '' }
                       : { qty: parseInt(s.slice(1, eq)) || 1, name: s.slice(eq+1).trim(), code: '' };
    });
  }
}

// ── STATUS CONFIG ─────────────────────────────────────────────────────────
const S = {
  pending:  { card: 's-new',   badge: 'badge-new',  badgeTxt: 'NUOVO',          btn: 'btn-new',  btnTxt: '<i class="fas fa-fire"></i> In preparazione →' },
  preparing:{ card: 's-prep',  badge: 'badge-prep', badgeTxt: 'IN PREP',        btn: 'btn-prep', btnTxt: '<i class="fas fa-check"></i> Pronto →' },
  ready:    { card: 's-ready', badge: 'badge-ready',badgeTxt: 'PRONTO',         btn: 'btn-ready',btnTxt: '<i class="fas fa-motorcycle"></i> Servito — Consegnato ✓' },
};

// ── RENDER ORDER CARD ─────────────────────────────────────────────────────
function renderOrderCard(order) {
  const items   = parseItems(order.order_details);
  const status  = order.status;
  const cfg     = S[status] || S.pending;
  const min     = elapsedMin(order.created_at);
  const isUrgent= status === 'pending' && min >= 10;
  const cardClass = isUrgent ? 's-urgent' : cfg.card;
  const badgeClass= isUrgent ? 'badge-urgent' : cfg.badge;
  const badgeTxt  = isUrgent ? 'ATTESA' : cfg.badgeTxt;
  const time    = new Date(order.created_at).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });

  const itemsHtml = items.map(i =>
    `<li><span class="item-qty">×${i.qty}</span><span class="item-name">${i.name}</span>${i.code ? `<span class="item-code">#${i.code}</span>` : ''}</li>`
  ).join('');

  const noteHtml = order.customer_notes
    ? `<div class="card-note"><i class="fas fa-pen-to-square"></i>${order.customer_notes}</div>` : '';

  const card = document.createElement('div');
  card.className = `order-card ${cardClass}`;
  card.dataset.orderId = order.order_id;
  card.dataset.status  = status;

  card.innerHTML = `<div class="card-inner">
    <div class="card-top">
      <div>
        <div class="card-table-label">Tavolo</div>
        <div class="card-table-num">${order.table_number}</div>
      </div>
      <div class="card-right">
        <div class="card-status-badge ${badgeClass}"><span class="badge-dot"></span>${badgeTxt}</div>
        <div class="card-timer ${timerClass(min, status)}" data-created="${order.created_at}" data-status="${status}">⏱ ${timerText(min)}</div>
        <div style="font-size:0.72em;color:var(--text3);">${time}</div>
      </div>
    </div>
    <hr class="card-divider">
    <ul class="card-items">${itemsHtml}</ul>
    ${noteHtml}
    <button class="card-action ${cfg.btn}">${cfg.btnTxt}</button>
  </div>`;

  card.querySelector('.card-action').addEventListener('click', async () => {
    if (status === 'ready') {
      // Flash "Consegnato" prima di sparire
      card.innerHTML = `<div class="delivered-msg">
        <i class="fas fa-check-circle"></i>
        <p>Consegnato!</p>
        <small>Tavolo ${order.table_number}</small>
      </div>`;
      card.classList.add('s-delivered');
      setTimeout(async () => {
        card.classList.add('card-out');
        await advanceStatus(order.order_id, status);
        setTimeout(() => { card.remove(); updateBadges(); }, 350);
      }, 1400);
    } else {
      await advanceStatus(order.order_id, status);
    }
  });

  return card;
}

// ── RENDER STAFF CARD ─────────────────────────────────────────────────────
const STAFF_TYPES = {
  explanation: { icon: 'fa-circle-info',          label: 'Spiegazione piatti' },
  drinks:      { icon: 'fa-mug-saucer',           label: 'Ordine bevande' },
  bill:        { icon: 'fa-file-invoice-dollar',  label: 'Richiesta conto' },
  call:        { icon: 'fa-bell',                 label: 'Chiamata cameriere' },
  other:       { icon: 'fa-comment-dots',         label: 'Altra richiesta' },
};

function renderStaffCard(order) {
  const type = order.waiter_request || 'call';
  const info = STAFF_TYPES[type] || STAFF_TYPES.other;
  const time = new Date(order.created_at).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });

  const card = document.createElement('div');
  card.className = 'staff-card';
  card.dataset.orderId = order.order_id;

  card.innerHTML = `<div class="staff-inner">
    <div class="staff-top">
      <div>
        <div class="staff-table-label">Tavolo</div>
        <div class="staff-table">${order.table_number}</div>
      </div>
      <div style="text-align:right;font-size:0.78em;color:var(--text3);">${time}</div>
    </div>
    <div class="staff-type"><i class="fas ${info.icon}"></i><span class="staff-type-label">${info.label}</span></div>
    <button class="staff-dismiss"><i class="fas fa-check"></i> Gestita ✓</button>
  </div>`;

  card.querySelector('.staff-dismiss').addEventListener('click', async () => {
    card.classList.add('card-out');
    await dismissStaff(order.order_id);
    setTimeout(() => { card.remove(); updateBadges(); }, 350);
  });

  return card;
}

// ── SUPABASE OPS ──────────────────────────────────────────────────────────
const CYCLE = ['pending','preparing','ready'];

async function advanceStatus(orderId, cur) {
  const idx  = CYCLE.indexOf(cur);
  const next = idx >= CYCLE.length - 1 ? 'served' : CYCLE[idx + 1];
  const now  = new Date().toISOString();
  const upd  = { status: next };
  if (next === 'preparing') upd.preparing_at = now;
  if (next === 'ready')     upd.ready_at     = now;
  if (next === 'served')    upd.served_at    = now;
  const { error } = await client.from('orders').update(upd).eq('order_id', orderId);
  if (error) console.warn('update error:', error.message);
}

async function dismissStaff(orderId) {
  await client.from('orders').update({ status: 'handled' }).eq('order_id', orderId);
}

// ── BADGES ────────────────────────────────────────────────────────────────
function updateBadges() {
  const nO = document.getElementById('orders-container').querySelectorAll('.order-card').length;
  const nS = document.getElementById('staff-container').querySelectorAll('.staff-card').length;
  document.getElementById('badge-orders').textContent = nO;
  document.getElementById('badge-staff').textContent  = nS;
  document.getElementById('stat-orders').textContent  = nO;
  document.getElementById('stat-staff').textContent   = nS;
  document.getElementById('stat-update').textContent  = 'Aggiornato ' +
    new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('empty-orders').style.display = nO === 0 ? 'block' : 'none';
  document.getElementById('empty-staff').style.display  = nS === 0 ? 'block' : 'none';
}

function removeCard(orderId) {
  const card = document.querySelector(`[data-order-id="${orderId}"]`);
  if (!card) return;
  card.classList.add('card-out');
  setTimeout(() => { card.remove(); updateBadges(); }, 350);
}

function updateOrderCard(order) {
  const existing = document.querySelector(`.order-card[data-order-id="${order.order_id}"]`);
  if (order.status === 'served') {
    if (existing) { existing.classList.add('card-out'); setTimeout(() => { existing.remove(); updateBadges(); }, 350); }
    return;
  }
  if (existing) { existing.replaceWith(renderOrderCard(order)); }
  updateBadges();
}

// ── LOAD FROM SUPABASE ────────────────────────────────────────────────────
async function loadInitialOrders() {
  const { data, error } = await client
    .from('orders').select('*')
    .not('status','in','("served","handled")')
    .order('created_at', { ascending: true });
  if (error) { console.error(error); return; }
  const oC = document.getElementById('orders-container');
  const sC = document.getElementById('staff-container');
  (data || []).forEach(o => {
    if (o.waiter_request) sC.appendChild(renderStaffCard(o));
    else                  oC.appendChild(renderOrderCard(o));
  });
  updateBadges();
}

// ── REALTIME ──────────────────────────────────────────────────────────────
client.channel('staff-rt')
  .on('postgres_changes', { event:'INSERT', schema:'public', table:'orders' }, ({ new: o }) => {
    playBeep();
    if (o.waiter_request) document.getElementById('staff-container').prepend(renderStaffCard(o));
    else                  document.getElementById('orders-container').prepend(renderOrderCard(o));
    updateBadges();
  })
  .on('postgres_changes', { event:'UPDATE', schema:'public', table:'orders' }, ({ new: o }) => {
    if (o.waiter_request) { if (o.status === 'handled') removeCard(o.order_id); }
    else updateOrderCard(o);
  })
  .subscribe();

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jun — KDS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a; --surf:#161616; --border:#222;
  --t1:#f0f0f0; --t2:#888; --t3:#3a3a3a;
  --c-new:#d97706; --c-prep:#2563eb; --c-ready:#16a34a;
  --c-req:#ea580c; --c-urg:#dc2626;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'DM Sans',-apple-system,sans-serif;overflow-x:hidden;}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:#000;border-bottom:1px solid #1a1a1a;
  height:52px;padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.h-logo{height:24px;object-fit:contain;filter:brightness(0) invert(1);flex-shrink:0;}
.h-mid{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;}
.h-badge{
  display:flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:20px;
  font-size:0.76em;font-weight:700;letter-spacing:.2px;
}
.hb-o{background:rgba(217,119,6,.14);color:var(--c-new);}
.hb-s{background:rgba(234,88,12,.14);color:var(--c-req);}
.hb-r{background:rgba(22,163,74,.14);color:var(--c-ready);}
.h-dot{width:7px;height:7px;border-radius:50%;background:var(--c-ready);animation:blink 2.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#clock{font-size:1em;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}

/* ── TOOLBAR ── */
#toolbar{
  background:#0f0f0f;border-bottom:1px solid var(--border);
  padding:5px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.tb{font-size:0.76em;color:var(--t2);}
.tb strong{color:var(--t1);font-weight:700;}
#tb-update{font-size:0.72em;color:var(--t3);}
#demo-btn{
  margin-left:auto;padding:5px 13px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:var(--t2);border-radius:20px;font-size:0.74em;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
#demo-btn:hover{background:rgba(255,255,255,.1);color:var(--t1);}
#demo-btn:disabled{opacity:.5;cursor:default;}

/* ── GRID ── */
#kds-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:10px;padding:10px;
  align-items:start;
}

/* ── EMPTY ── */
#kds-empty{
  grid-column:1/-1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;gap:14px;text-align:center;color:var(--t3);
}
#kds-empty i{font-size:2.8em;opacity:.25;}
#kds-empty p{font-size:0.9em;}

/* ── CARD ── */
@keyframes slideIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:scale(.95);pointer-events:none}}
@keyframes readyPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}
  50%    {box-shadow:0 0 0 8px rgba(22,163,74,.18)}
}

.kds-card{
  background:var(--surf);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
  animation:slideIn .22s ease-out;
  border:1px solid var(--border);
}
.kds-card.s-ready{animation:readyPulse 2.6s ease-in-out infinite;}
.kds-card.card-out{animation:cardOut .28s ease-out forwards;}

/* ── CARD HEADER ── */
.card-hd{
  padding:11px 14px 13px;
  display:flex;align-items:flex-end;justify-content:space-between;
  flex-shrink:0;
}
.s-new  .card-hd{background:var(--c-new);}
.s-prep .card-hd{background:var(--c-prep);}
.s-ready.card-hd,.s-ready .card-hd{background:var(--c-ready);}
.s-req  .card-hd{background:var(--c-req);}
.s-urg  .card-hd{background:var(--c-urg);}

.card-hd-l{display:flex;flex-direction:column;line-height:1;}
.card-hd-lbl{
  font-size:0.58em;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:rgba(255,255,255,.65);
  margin-bottom:1px;
}
.card-hd-num{
  font-size:4em;font-weight:900;color:#fff;
  letter-spacing:-0.05em;line-height:.9;
}
.card-hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.card-hd-status{
  font-size:0.62em;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:rgba(255,255,255,.75);
}
.card-hd-timer{
  font-size:1.05em;font-weight:700;color:#fff;
  font-variant-numeric:tabular-nums;
}

/* ── CARD BODY ── */
.card-body{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:8px;}

.card-items{list-style:none;display:flex;flex-direction:column;gap:5px;}
.card-items li{display:flex;align-items:baseline;gap:7px;font-size:0.87em;}
.i-qty{font-weight:800;min-width:26px;color:var(--t2);}
.i-name{color:var(--t1);flex:1;line-height:1.35;}
.i-code{color:var(--t3);font-size:0.78em;font-variant-numeric:tabular-nums;}

.card-note{
  display:flex;align-items:flex-start;gap:7px;
  padding:7px 10px;border-radius:0 8px 8px 0;
  border-left:2px solid var(--t3);
  background:rgba(255,255,255,.03);
  font-size:0.81em;color:var(--t2);line-height:1.4;
}
.card-note i{color:var(--t3);font-size:.85em;margin-top:2px;flex-shrink:0;}

/* ── STAFF REQUEST TYPE ── */
.req-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(234,88,12,.08);border-radius:10px;
}
.req-row i{color:var(--c-req);font-size:1.2em;width:20px;text-align:center;}
.req-row span{font-size:0.95em;font-weight:600;color:#fb923c;}

/* ── ACTION BUTTON ── */
.card-btn{
  width:100%;padding:14px;border:none;border-top:1px solid var(--border);
  font-family:inherit;font-size:0.86em;font-weight:800;letter-spacing:.3px;
  text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .12s;flex-shrink:0;
  background:#111;
}
.card-btn:active{filter:brightness(.85);}
.card-btn:hover{filter:brightness(1.15);}
.btn-new  {color:var(--c-new);}
.btn-prep {color:var(--c-prep);}
.btn-ready{background:var(--c-ready);color:#fff;border-top-color:transparent;font-size:.92em;}
.btn-req  {color:var(--c-req);}

/* ── DELIVERED OVERLAY ── */
.done-wrap{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:22px;gap:8px;text-align:center;
}
.done-wrap i{font-size:2.6em;color:var(--c-ready);}
.done-wrap strong{color:var(--c-ready);font-size:1em;}
.done-wrap small{color:var(--t3);font-size:0.8em;}
</style>
</head>
<body>

<header>
  <img class="h-logo" src="https://www.junrestaurantbolgare.com/wp-content/uploads/2024/12/jun-logo-white.svg" alt="Jun">
  <div class="h-mid">
    <div class="h-badge hb-o"><i class="fas fa-utensils"></i> <span id="hb-orders">0</span></div>
    <div class="h-badge hb-r"><i class="fas fa-bell-concierge"></i> <span id="hb-ready">0</span></div>
    <div class="h-badge hb-s"><i class="fas fa-bell"></i> <span id="hb-staff">0</span></div>
    <div class="h-dot"></div>
  </div>
  <span id="clock">--:--</span>
</header>

<div id="toolbar">
  <span class="tb">Ordini: <strong id="tb-orders">0</strong></span>
  <span class="tb">Pronti: <strong id="tb-ready">0</strong></span>
  <span class="tb">Richieste: <strong id="tb-staff">0</strong></span>
  <span id="tb-update"></span>
  <button id="demo-btn" onclick="loadDemo()"><i class="fas fa-flask"></i> Demo</button>
</div>

<div id="kds-grid">
  <div id="kds-empty">
    <i class="fas fa-circle-check"></i>
    <p>Nessun ordine attivo</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL  = "https://jnzxhokxldzymnapcchd.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impuenhob2t4bGR6eW1uYXBjY2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MDkyODIsImV4cCI6MjA4MTI4NTI4Mn0.EaPqeczsuYGwMky9t5ove_uk17dNWcYFaWXb2CfiFgo";
const client  = supabase.createClient(SB_URL, SB_ANON);

// ── State ──────────────────────────────────────────────────────────────────
const liveData    = new Map();   // orderId → order
const animating   = new Set();   // orderIds currently in exit animation

// ── Clock ──────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick, 10000);

// ── Audio ──────────────────────────────────────────────────────────────────
function beep() {
  try {
    const ctx = new(window.AudioContext||window.webkitAudioContext)();
    [880,1100].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(.3,ctx.currentTime+i*.15);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.15+.3);
      o.start(ctx.currentTime+i*.15);o.stop(ctx.currentTime+i*.15+.3);
    });
  } catch(_){}
}

// ── Timer ──────────────────────────────────────────────────────────────────
function elMin(ts){ return Math.floor((Date.now()-new Date(ts))/60000); }
function fmtMin(m){ return m<1?'<1 min':`${m} min`; }

setInterval(()=>{
  document.querySelectorAll('[data-ts]').forEach(el=>{
    el.textContent = fmtMin(elMin(el.dataset.ts));
  });
  // Escalate long-waiting pending cards to urgent
  liveData.forEach((o,id)=>{
    if(o.waiter_request||o.status!=='pending') return;
    if(elMin(o.created_at)>=10){
      const card=document.querySelector(`.kds-card[data-id="${id}"]`);
      if(card&&!card.classList.contains('s-urg')){
        card.classList.remove('s-new');
        card.classList.add('s-urg');
        card.querySelector('.card-hd-status').textContent='ATTESA';
      }
    }
  });
},60000);

// ── Sort ───────────────────────────────────────────────────────────────────
function sortKey(o){
  const st=o.status, req=!!o.waiter_request;
  const w = st==='ready' ? 0 : req ? 1 : st==='preparing' ? 2 : 3;
  return w*1e13 + new Date(o.created_at).getTime();
}

// ── Parse items ────────────────────────────────────────────────────────────
function parseItems(raw){
  try{return JSON.parse(raw);}catch{
    return String(raw||'').split(',').filter(Boolean).map(s=>{
      const e=s.indexOf('=');
      return e<0?{qty:1,name:s.trim(),code:''}:{qty:parseInt(s.slice(1,e))||1,name:s.slice(e+1).trim(),code:''};
    });
  }
}

// ── Staff request labels ───────────────────────────────────────────────────
const STAFF={
  explanation:{icon:'fa-circle-info',label:'Spiegazione piatti'},
  drinks:     {icon:'fa-mug-saucer', label:'Ordine bevande'},
  bill:       {icon:'fa-receipt',    label:'Richiesta conto'},
  call:       {icon:'fa-bell',       label:'Chiamata cameriere'},
  other:      {icon:'fa-comment-dots',label:'Altra richiesta'},
};

// ── Build order card ───────────────────────────────────────────────────────
function buildOrderCard(o){
  const items  = parseItems(o.order_details);
  const st     = o.status;
  const min    = elMin(o.created_at);
  const isUrg  = st==='pending' && min>=10;

  const sClass  = isUrg ? 's-urg' : st==='pending' ? 's-new' : st==='preparing' ? 's-prep' : 's-ready';
  const sTxt    = isUrg ? 'ATTESA' : st==='pending' ? 'NUOVO' : st==='preparing' ? 'IN PREP' : 'PRONTO';
  const btnCls  = st==='pending' ? 'btn-new' : st==='preparing' ? 'btn-prep' : 'btn-ready';
  const btnTxt  = st==='pending'
    ? '<i class="fas fa-fire-burner"></i> In preparazione'
    : st==='preparing'
    ? '<i class="fas fa-bell-concierge"></i> Pronto'
    : '<i class="fas fa-check"></i> Servito — Consegnato';

  const itemsHtml = items.map(i=>
    `<li>
      <span class="i-qty">×${i.qty}</span>
      <span class="i-name">${i.name}</span>
      ${i.code?`<span class="i-code">#${i.code}</span>`:''}
    </li>`
  ).join('');

  const noteHtml = o.customer_notes
    ? `<div class="card-note"><i class="fas fa-pen-line"></i>${o.customer_notes}</div>`:'';

  const card = document.createElement('div');
  card.className = `kds-card ${sClass}`;
  card.dataset.id = String(o.order_id);
  card.innerHTML = `
    <div class="card-hd">
      <div class="card-hd-l">
        <span class="card-hd-lbl">Tavolo</span>
        <span class="card-hd-num">${o.table_number}</span>
      </div>
      <div class="card-hd-r">
        <span class="card-hd-status">${sTxt}</span>
        <span class="card-hd-timer" data-ts="${o.created_at}">${fmtMin(min)}</span>
      </div>
    </div>
    <div class="card-body">
      <ul class="card-items">${itemsHtml}</ul>
      ${noteHtml}
    </div>
    <button class="card-btn ${btnCls}">${btnTxt}</button>`;

  card.querySelector('.card-btn').addEventListener('click', async ()=>{
    const id = String(o.order_id);
    if(st==='ready'){
      // Consegnato animation
      animating.add(id);
      liveData.delete(id);
      card.querySelector('.card-body').innerHTML=`<div class="done-wrap">
        <i class="fas fa-circle-check"></i>
        <strong>Consegnato!</strong>
        <small>Tavolo ${o.table_number}</small>
      </div>`;
      card.querySelector('.card-btn').remove();
      updateStats();
      setTimeout(()=>{
        card.classList.add('card-out');
        setTimeout(()=>{card.remove();animating.delete(id);updateEmpty();updateStats();},280);
      },1300);
      await advance(id,st);
    } else {
      // Optimistic update
      const nst = st==='pending'?'preparing':'ready';
      liveData.set(id,{...o,status:nst});
      renderGrid();
      await advance(id,st);
    }
  });

  return card;
}

// ── Build staff request card ───────────────────────────────────────────────
function buildStaffCard(o){
  const type = o.waiter_request||'call';
  const info = STAFF[type]||STAFF.other;
  const min  = elMin(o.created_at);

  const card = document.createElement('div');
  card.className = 'kds-card s-req';
  card.dataset.id = String(o.order_id);
  card.innerHTML = `
    <div class="card-hd">
      <div class="card-hd-l">
        <span class="card-hd-lbl">Tavolo</span>
        <span class="card-hd-num">${o.table_number}</span>
      </div>
      <div class="card-hd-r">
        <span class="card-hd-status">RICHIESTA</span>
        <span class="card-hd-timer" data-ts="${o.created_at}">${fmtMin(min)}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="req-row">
        <i class="fas ${info.icon}"></i>
        <span>${info.label}</span>
      </div>
    </div>
    <button class="card-btn btn-req"><i class="fas fa-check"></i> Gestita</button>`;

  card.querySelector('.card-btn').addEventListener('click', async ()=>{
    const id = String(o.order_id);
    animating.add(id);
    liveData.delete(id);
    card.classList.add('card-out');
    updateStats();
    setTimeout(()=>{card.remove();animating.delete(id);updateEmpty();updateStats();},280);
    await client.from('orders').update({status:'handled'}).eq('order_id',id);
  });

  return card;
}

// ── Render full grid ───────────────────────────────────────────────────────
function renderGrid(){
  const grid  = document.getElementById('kds-grid');
  const empty = document.getElementById('kds-empty');

  // Remove non-animating cards
  grid.querySelectorAll('.kds-card').forEach(el=>{
    if(!animating.has(el.dataset.id)) el.remove();
  });

  const sorted = [...liveData.values()].sort((a,b)=>sortKey(a)-sortKey(b));
  sorted.forEach(o=>{
    const card = o.waiter_request ? buildStaffCard(o) : buildOrderCard(o);
    grid.appendChild(card);
  });

  updateEmpty();
  updateStats();
}

function updateEmpty(){
  const grid  = document.getElementById('kds-grid');
  const empty = document.getElementById('kds-empty');
  const hasCards = grid.querySelectorAll('.kds-card').length > 0;
  if(!hasCards){
    if(!grid.contains(empty)) grid.appendChild(empty);
    empty.style.display='';
  } else {
    empty.style.display='none';
  }
}

function updateStats(){
  let nO=0,nR=0,nS=0;
  liveData.forEach(o=>{
    if(o.waiter_request) nS++;
    else{nO++;if(o.status==='ready')nR++;}
  });
  document.getElementById('hb-orders').textContent=nO;
  document.getElementById('hb-ready').textContent=nR;
  document.getElementById('hb-staff').textContent=nS;
  document.getElementById('tb-orders').textContent=nO;
  document.getElementById('tb-ready').textContent=nR;
  document.getElementById('tb-staff').textContent=nS;
  document.getElementById('tb-update').textContent=
    'Aggiornato '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

// ── Supabase ops ───────────────────────────────────────────────────────────
const CYCLE=['pending','preparing','ready'];
async function advance(id,cur){
  const idx=CYCLE.indexOf(cur);
  const next=idx>=CYCLE.length-1?'served':CYCLE[idx+1];
  const{error}=await client.from('orders').update({status:next}).eq('order_id',id);
  if(error) console.warn('advance:',error.message);
}

// ── Load ───────────────────────────────────────────────────────────────────
async function loadInitialOrders(){
  const{data,error}=await client.from('orders').select('*')
    .not('status','in','("served","handled")')
    .order('created_at',{ascending:true});
  if(error){console.error(error);return;}
  (data||[]).forEach(o=>liveData.set(String(o.order_id),o));
  renderGrid();
}

// ── Realtime ───────────────────────────────────────────────────────────────
client.channel('kds-rt')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},({new:o})=>{
    beep();
    liveData.set(String(o.order_id),o);
    renderGrid();
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},({new:o})=>{
    const id=String(o.order_id);
    if(o.status==='served'||o.status==='handled'){
      liveData.delete(id);
      if(!animating.has(id)){
        const el=document.querySelector(`.kds-card[data-id="${id}"]`);
        if(el){el.classList.add('card-out');setTimeout(()=>{el.remove();updateEmpty();updateStats();},280);}
      }
    } else {
      liveData.set(id,o);
      renderGrid();
    }
  })
  .subscribe();

// ── Demo ───────────────────────────────────────────────────────────────────
function loadDemo(){
  const btn=document.getElementById('demo-btn');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-check"></i> Demo';
  const now=Date.now();
  [
    {order_id:'demo-1',table_number:3,status:'pending',
     created_at:new Date(now-2*60000).toISOString(),
     customer_notes:'Senza wasabi — allergia sesamo',waiter_request:null,
     order_details:JSON.stringify([
       {qty:2,name:'Nigiri Salmone',code:'101'},
       {qty:1,name:'Tacos JUN Selection',code:'201'},
       {qty:3,name:'Uramaki Spicy Crunch',code:'301'},
     ])},
    {order_id:'demo-2',table_number:7,status:'preparing',
     created_at:new Date(now-9*60000).toISOString(),
     customer_notes:null,waiter_request:null,
     order_details:JSON.stringify([
       {qty:4,name:'Sashimi Tonno Premium',code:'150'},
       {qty:2,name:'Gyoza Pollo',code:'401'},
     ])},
    {order_id:'demo-3',table_number:12,status:'ready',
     created_at:new Date(now-14*60000).toISOString(),
     customer_notes:null,waiter_request:null,
     order_details:JSON.stringify([
       {qty:2,name:'JUN Selection',code:'001'},
       {qty:3,name:'Dim Sum Gamberetti',code:'601'},
       {qty:1,name:'Tataki Salmone',code:'701'},
     ])},
    {order_id:'demo-4',table_number:5,status:'pending',
     created_at:new Date(now-13*60000).toISOString(),
     customer_notes:null,waiter_request:null,
     order_details:JSON.stringify([
       {qty:6,name:'Hosomaki Salmone',code:'801'},
       {qty:2,name:'Edamame',code:'901'},
     ])},
    {order_id:'demo-w1',table_number:9,status:'pending',
     created_at:new Date(now-1*60000).toISOString(),
     customer_notes:null,waiter_request:'bill',order_details:'[]'},
  ].forEach(o=>liveData.set(o.order_id,o));
  renderGrid();
}

loadInitialOrders();
</script>
</body>
</html>

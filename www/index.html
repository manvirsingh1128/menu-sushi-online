<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jun KDS — Scegli postazione</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ background:#0e0f12; color:#eee; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; padding:24px; }
  .logo{ font-size:2.2rem; font-weight:800; letter-spacing:.02em; margin-bottom:4px; }
  .logo span{ font-weight:400; color:#8b93a1; }
  .sub{ color:#8b93a1; font-size:.85rem; margin-bottom:24px; letter-spacing:.06em; text-transform:uppercase; text-align:center; }
  #last{ width:100%; max-width:760px; margin-bottom:14px; }
  #last a{ display:flex; align-items:center; justify-content:center; gap:10px; background:#16a34a; color:#fff;
    text-decoration:none; padding:16px; border-radius:16px; font-size:1.1rem; font-weight:800; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; width:100%; max-width:760px; }
  .st{ background:#1a1d23; border:1px solid #2a2f38; border-radius:18px; padding:22px 14px; text-align:center;
    cursor:pointer; transition:transform .08s, background .15s; text-decoration:none; color:#eee; display:block; }
  .st:active{ transform:scale(.96); }
  .st:hover{ background:#232830; }
  .st .emo{ font-size:2.4rem; display:block; margin-bottom:8px; }
  .st .nm{ font-size:1.05rem; font-weight:700; }
  .st .desc{ font-size:.72rem; color:#8b93a1; margin-top:3px; }
  .st.owner{ border-color:#3b82f6; } .st.expo{ border-color:#8b5cf6; } .st.cameriere{ border-color:#f59e0b; }
  .foot{ margin-top:26px; color:#5b626e; font-size:.75rem; text-align:center; }
</style>
</head>
<body>
  <div class="logo">俊 JUN <span>KDS</span></div>
  <div class="sub">Scegli la postazione di questo tablet</div>

  <div id="last"></div>
  <div class="grid" id="grid"></div>

  <div class="foot">La scelta viene ricordata su questo dispositivo · tocca un'altra postazione per cambiarla</div>

<script>
  const STATIONS = [
    { id:'crudo',     emo:'🍣', nm:'Crudo',       desc:'sashimi · nigiri · uramaki' },
    { id:'frittura',  emo:'🍤', nm:'Frittura',    desc:'fritti · tempura' },
    { id:'caldo',     emo:'🍜', nm:'Caldo / Wok', desc:'riso · pasta · secondi' },
    { id:'griglia',   emo:'🔥', nm:'Griglia',     desc:'griglia · vapore · freddi' },
    { id:'cameriere', emo:'🛎️', nm:'Cameriere',   desc:'da servire · sala' },
    { id:'expo',      emo:'🧭', nm:'Regia',        desc:'panoramica ordini' },
    { id:'owner',     emo:'📊', nm:'Owner',        desc:'sala · conti · incassi' },
  ];
  const url = s => 'dashboard.html?station=' + s;
  const grid = document.getElementById('grid');
  STATIONS.forEach(s => {
    const a = document.createElement('a');
    a.className = 'st ' + s.id;
    a.href = url(s.id);
    a.addEventListener('click', () => { try{ localStorage.setItem('jun_kds_station', s.id); }catch(e){} });
    a.innerHTML = `<span class="emo">${s.emo}</span><span class="nm">${s.nm}</span><span class="desc">${s.desc}</span>`;
    grid.appendChild(a);
  });
  // scorciatoia "riapri l'ultima postazione usata"
  try{
    const last = localStorage.getItem('jun_kds_station');
    const st = STATIONS.find(x => x.id === last);
    if(st){
      document.getElementById('last').innerHTML = `<a href="${url(st.id)}">${st.emo} Riapri: ${st.nm}</a>`;
    }
  }catch(e){}
</script>
</body>
</html>

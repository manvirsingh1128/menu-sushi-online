<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Jun — Menu</title>
<script>
/* Router per orario (ora italiana Europe/Rome) — un solo QR per tavolo:
   junordini.it/t?t=N  →  pranzo (PDF) / cena (menu AYCE) / chiuso
   Orari ristorante: Mar–Dom  Pranzo 12:00–14:45 · Cena 18:45–23:00 · Lunedì chiuso
   Finestre menu: 15 min prima apertura, +25 dopo chiusura pranzo; la cena va fino alle 00:00. */
(function(){
  function romeNow(){
    // ora italiana robusta (gestisce automaticamente l'ora legale)
    try { return new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Rome' })); }
    catch(e){ return new Date(); }
  }
  var now  = romeNow();
  var day  = now.getDay();                         // 0=Dom 1=Lun 2=Mar ... 6=Sab
  var mins = now.getHours()*60 + now.getMinutes();

  var LUNCH_START  = 11*60 + 45;   // 11:45 (12:00 − 15')
  var LUNCH_END    = 15*60 + 10;   // 15:10 (14:45 + 25')
  var DINNER_START = 18*60 + 30;   // 18:30 (18:45 − 15')
  var DINNER_END   = 24*60;        // 00:00 (cena estesa fino a mezzanotte)

  var mode = 'closed';
  if (day !== 1) {                                 // lunedì (1) sempre chiuso
    if (mins >= LUNCH_START && mins <= LUNCH_END)      mode = 'pranzo';
    else if (mins >= DINNER_START && mins < DINNER_END) mode = 'sera';
  }

  var params = new URLSearchParams(location.search);
  var t = params.get('t');

  if (mode === 'sera') {
    // percorsi RELATIVI ai file reali → funzionano sia su GitHub Pages sia sul dominio
    var u = 'menu.html?k=jun2025' + (t ? ('&t=' + encodeURIComponent(t)) : '');
    location.replace(u);
  } else if (mode === 'pranzo') {
    location.replace('web-Menu-pranzo-21x30-1.pdf');
  }
  // mode === 'closed' → resta su questa pagina (mostra il messaggio sotto)
  window.__junClosed = (mode === 'closed');
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0f1115; color:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 22px; text-align:center;
  }
  .wrap { max-width:360px; width:100%; }
  .logo { font-size:2.6em; font-weight:800; letter-spacing:2px; margin-bottom:6px; }
  .logo span { color:#e11d2a; }
  .sub { font-size:0.8em; letter-spacing:3px; color:#9aa0a8; text-transform:uppercase; margin-bottom:34px; }
  .closed-badge {
    display:inline-block; background:#e11d2a; color:#fff; font-weight:700;
    font-size:0.78em; letter-spacing:1px; padding:7px 16px; border-radius:999px;
    text-transform:uppercase; margin-bottom:18px;
  }
  h1 { font-size:1.35em; font-weight:700; margin-bottom:10px; }
  p.msg { font-size:0.92em; color:#c8ccd2; line-height:1.5; margin-bottom:26px; }
  .hours {
    background:#171a20; border:1px solid #24272e; border-radius:16px;
    padding:16px 18px; text-align:left; font-size:0.86em;
  }
  .hours .h-title { font-weight:700; margin-bottom:10px; font-size:0.92em; color:#f5f5f5; }
  .hours .h-row { display:flex; justify-content:space-between; padding:4px 0; color:#c8ccd2; }
  .hours .h-row.closed-day { color:#e26a70; }
  .hours .h-row b { font-weight:600; color:#f5f5f5; }
  .loading { color:#9aa0a8; font-size:0.9em; }
</style>
</head>
<body>
  <div class="wrap" id="content" style="display:none;">
    <div class="logo">JU<span>N</span></div>
    <div class="sub">Restaurant</div>
    <div class="closed-badge">Chiuso</div>
    <h1>Al momento siamo chiusi</h1>
    <p class="msg">Il menu è disponibile durante gli orari di apertura. Ti aspettiamo!</p>
    <div class="hours">
      <div class="h-title">Orari di apertura</div>
      <div class="h-row"><b>Mar – Dom</b><span>12:00–14:45 · 18:45–23:00</span></div>
      <div class="h-row closed-day"><b>Lunedì</b><span>Chiuso</span></div>
    </div>
    <button id="staff-btn" type="button" style="margin-top:24px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#9aa0a8;padding:9px 20px;border-radius:999px;font-size:0.8em;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.3px;">🔑 Accesso staff</button>
  </div>
  <div class="loading" id="loading">Caricamento menu…</div>

  <!-- OVERRIDE STAFF: sblocca la pagina "Chiuso" con la password (es. orario/orologio sbagliato) -->
  <div id="staff-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;padding:22px;">
    <div style="background:#171a20;border:1px solid #24272e;border-radius:18px;width:100%;max-width:300px;padding:26px 22px 22px;text-align:left;">
      <h3 style="font-size:1.05em;font-weight:700;margin-bottom:6px;">Accesso staff</h3>
      <p style="color:#9aa0a8;font-size:0.82em;margin-bottom:16px;">Inserisci la password per aprire il menu.</p>
      <input id="staff-pw" type="password" autocomplete="off" placeholder="Password" style="width:100%;padding:13px 15px;background:#0f1115;border:1.5px solid #2a2e36;border-radius:12px;color:#f5f5f5;font-size:1em;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:8px;">
      <p id="staff-err" style="color:#ff6b6b;font-size:0.8em;margin-bottom:12px;display:none;">Password errata</p>
      <div style="display:flex;gap:10px;">
        <button id="staff-cancel" type="button" style="flex:1;padding:13px;background:rgba(255,255,255,0.06);color:#f5f5f5;border:none;border-radius:12px;font-size:0.9em;font-weight:600;cursor:pointer;font-family:inherit;">Annulla</button>
        <button id="staff-enter" type="button" style="flex:1;padding:13px;background:#e11d2a;color:#fff;border:none;border-radius:12px;font-size:0.9em;font-weight:700;cursor:pointer;font-family:inherit;">Entra</button>
      </div>
    </div>
  </div>
  <script>
    // Mostra il messaggio "chiuso" solo se non stiamo reindirizzando
    if (window.__junClosed) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = '';

      // Override staff: la stessa password del menu (JUN321@) apre comunque il menu cena,
      // così un blocco per orario/orologio sbagliato si può togliere come gli altri blocchi.
      var ADMIN_PW = 'JUN321@';
      var ov  = document.getElementById('staff-overlay');
      var pw  = document.getElementById('staff-pw');
      var err = document.getElementById('staff-err');
      function openStaff(){ err.style.display='none'; pw.value=''; ov.style.display='flex'; setTimeout(function(){ pw.focus(); }, 80); }
      function closeStaff(){ ov.style.display='none'; }
      function tryStaff(){
        if (pw.value === ADMIN_PW) {
          var t = new URLSearchParams(location.search).get('t');
          location.replace('menu.html?k=jun2025' + (t ? ('&t=' + encodeURIComponent(t)) : ''));
        } else {
          err.style.display='block'; pw.style.borderColor='#ff6b6b';
          setTimeout(function(){ pw.style.borderColor='#2a2e36'; }, 1200);
          pw.value=''; pw.focus();
        }
      }
      document.getElementById('staff-btn').addEventListener('click', openStaff);
      document.getElementById('staff-cancel').addEventListener('click', closeStaff);
      document.getElementById('staff-enter').addEventListener('click', tryStaff);
      ov.addEventListener('click', function(e){ if (e.target === ov) closeStaff(); });
      pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryStaff(); });
    }
  </script>
</body>
</html>
